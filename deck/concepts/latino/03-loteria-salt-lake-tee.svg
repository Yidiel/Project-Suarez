<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="'Archivo Narrow', 'Arial Narrow', Arial, sans-serif">
  <title>Lotería Salt Lake, six cards drawn flat on a heavyweight black tee</title>
  <defs>
    <path id="tee" d="M -92,-250 Q 0,-214 92,-250 L 232,-210 L 268,-88 L 184,-64 L 184,250 L -184,250 L -184,-64 L -268,-88 L -232,-210 Z"/>
    <path id="tee-seams" d="M -178,-236 L -184,-64 M 178,-236 L 184,-64 M -184,236 L 184,236 M -84,-242 Q 0,-206 84,-242" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- card frame, 160 x 240, origin top-left -->
    <g id="frame">
      <rect width="160" height="240" rx="3" fill="#F6F1EC" stroke="#212121" stroke-width="2"/>
      <rect x="8" y="8" width="144" height="188" fill="none" stroke="#212121" stroke-width="1"/>
      <line x1="8" y1="204" x2="152" y2="204" stroke="#212121" stroke-width="1"/>
    </g>
    <!-- 02 EL TRAX -->
    <g id="c1">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#4CACD1"/>
      <rect x="8" y="150" width="144" height="46" fill="#8DCEA8"/>
      <line x1="80" y1="20" x2="80" y2="60" stroke="#212121" stroke-width="2"/>
      <path d="M 60,60 L 100,60 L 80,48 Z" fill="#212121"/>
      <rect x="22" y="70" width="116" height="78" rx="10" fill="#A42F2C" stroke="#212121" stroke-width="2"/>
      <rect x="22" y="112" width="116" height="36" rx="0" fill="#F6F1EC" stroke="#212121" stroke-width="1.5"/>
      <rect x="32" y="80" width="22" height="24" fill="#F6F1EC" stroke="#212121"/><rect x="60" y="80" width="40" height="24" fill="#F6F1EC" stroke="#212121"/><rect x="106" y="80" width="22" height="24" fill="#F6F1EC" stroke="#212121"/>
      <rect x="8" y="152" width="144" height="4" fill="#212121"/>
      <circle cx="46" cy="152" r="9" fill="#212121"/><circle cx="114" cy="152" r="9" fill="#212121"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">02</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">EL TRAX</text>
    </g>
    <!-- 11 LA MONTAÑA -->
    <g id="c2">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#F58B88"/>
      <path d="M 8,170 L 44,96 L 64,122 L 94,56 L 124,110 L 134,96 L 152,140 L 152,196 L 8,196 Z" fill="#13375D"/>
      <path d="M 94,56 L 84,76 L 92,72 L 100,80 L 108,74 L 104,66 Z M 44,96 L 38,108 L 46,104 L 52,110 Z" fill="#F6F1EC"/>
      <rect x="8" y="170" width="144" height="26" fill="#0D4C26"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">11</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">LA MONTAÑA</text>
    </g>
    <!-- 03 EL TACO -->
    <g id="c3">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#FFDDA3"/>
      <path d="M 24,150 A 56,56 0 0 1 136,150 Z" fill="#F29F1F" stroke="#212121" stroke-width="2"/>
      <path d="M 30,150 A 50,50 0 0 1 130,150 L 128,150 C 116,120 100,112 80,118 C 60,112 44,120 32,150 Z" fill="#1A854C"/>
      <path d="M 38,150 C 50,128 60,124 80,128 C 100,124 110,128 122,150 Z" fill="#D24B27"/>
      <circle cx="64" cy="136" r="4" fill="#A42F2C"/><circle cx="92" cy="134" r="4" fill="#A42F2C"/>
      <path d="M 24,150 A 56,56 0 0 1 136,150" fill="none" stroke="#212121" stroke-width="2"/>
      <line x1="24" y1="150" x2="136" y2="150" stroke="#212121" stroke-width="2"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">03</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">EL TACO</text>
    </g>
    <!-- 26 LA SAL -->
    <g id="c4">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#FAC8C5"/>
      <!-- salt crystal cube, isometric, the lake's halite -->
      <path d="M 80,60 L 124,84 L 124,136 L 80,160 L 36,136 L 36,84 Z" fill="#F6F1EC" stroke="#212121" stroke-width="2"/>
      <path d="M 80,60 L 124,84 L 80,108 L 36,84 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
      <path d="M 80,108 L 124,84 L 124,136 L 80,160 Z" fill="#E6DFD8" stroke="#212121" stroke-width="2"/>
      <path d="M 80,108 L 80,160" stroke="#212121" stroke-width="2"/>
      <circle cx="52" cy="176" r="3" fill="#212121"/><circle cx="66" cy="182" r="2" fill="#212121"/><circle cx="104" cy="178" r="3" fill="#212121"/><circle cx="118" cy="172" r="2" fill="#212121"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">26</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">LA SAL</text>
    </g>
    <!-- 21 EL CAMARÓN -->
    <g id="c5">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#8DCEA8"/>
      <path d="M 40,150 C 30,110 60,60 104,56 C 128,54 136,76 122,88 C 110,96 96,88 90,100 C 82,116 90,130 72,146 C 62,154 50,156 40,150 Z" fill="#F58B88" stroke="#212121" stroke-width="2"/>
      <path d="M 54,142 L 70,134 M 60,126 L 78,120 M 70,110 L 88,106 M 84,96 L 100,96" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
      <path d="M 104,56 L 132,36 M 110,58 L 140,52" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
      <path d="M 40,150 L 24,162 M 40,150 L 30,170 M 40,150 L 44,172" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
      <circle cx="112" cy="68" r="3" fill="#212121"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">21</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">EL CAMARÓN</text>
    </g>
    <!-- 47 LA TROCA -->
    <g id="c6">
      <use xlink:href="#frame"/>
      <rect x="8" y="8" width="144" height="188" fill="#F29F1F"/>
      <rect x="8" y="156" width="144" height="40" fill="#D24B27"/>
      <path d="M 20,150 L 20,110 L 60,110 L 60,80 L 104,80 L 120,110 L 140,110 L 140,150 Z" fill="#13375D" stroke="#212121" stroke-width="2"/>
      <path d="M 68,88 L 100,88 L 110,108 L 68,108 Z" fill="#4CACD1" stroke="#212121" stroke-width="1.5"/>
      <rect x="20" y="118" width="40" height="8" fill="#F6F1EC"/>
      <circle cx="46" cy="150" r="14" fill="#212121"/><circle cx="46" cy="150" r="6" fill="#F6F1EC"/>
      <circle cx="116" cy="150" r="14" fill="#212121"/><circle cx="116" cy="150" r="6" fill="#F6F1EC"/>
      <text x="14" y="26" font-size="14" font-weight="700" fill="#212121">47</text>
      <text x="80" y="228" font-size="18" font-weight="700" fill="#212121" text-anchor="middle" letter-spacing="2">LA TROCA</text>
    </g>
    <!-- 3 x 2 grid, 520 x 500 box, origin top-left -->
    <g id="grid">
      <use xlink:href="#c1" x="0" y="0"/><use xlink:href="#c2" x="180" y="0"/><use xlink:href="#c3" x="360" y="0"/>
      <use xlink:href="#c4" x="0" y="260"/><use xlink:href="#c5" x="180" y="260"/><use xlink:href="#c6" x="360" y="260"/>
    </g>
  </defs>

  <rect width="1200" height="1500" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="22" font-weight="700" fill="#212121" letter-spacing="2">LATINO LANE 03 · LOTERÍA SALT LAKE</text>
  <text x="1140" y="52" font-size="16" fill="#555" text-anchor="end">Six cards, drawn flat, numbers that mean something here</text>

  <!-- FRONT: single card on left chest -->
  <g transform="translate(320,400)">
    <use xlink:href="#tee" fill="#212121" stroke="#212121" stroke-width="2"/>
    <use xlink:href="#tee-seams"/>
    <use xlink:href="#c5" transform="translate(50,-190) scale(0.5)"/>
    <text y="300" font-size="15" fill="#212121" text-anchor="middle" letter-spacing="2">FRONT · EL CAMARÓN, LEFT CHEST</text>
  </g>

  <!-- BACK: the six-card board -->
  <g transform="translate(880,400)">
    <use xlink:href="#tee" fill="#212121" stroke="#212121" stroke-width="2"/>
    <use xlink:href="#tee-seams"/>
    <use xlink:href="#grid" transform="translate(-148,-178) scale(0.57)"/>
    <text y="146" font-size="11" font-weight="700" fill="#F6F1EC" text-anchor="middle" letter-spacing="3">LOTERÍA SALT LAKE</text>
    <text y="300" font-size="15" fill="#212121" text-anchor="middle" letter-spacing="2">BACK · 11 IN BOARD</text>
  </g>

  <!-- DETAIL ROW: cards at size -->
  <g transform="translate(0,760)">
    <line x1="60" y1="0" x2="1140" y2="0" stroke="#DDD"/>
    <text x="60" y="34" font-size="14" fill="#555" letter-spacing="2">THE SIX CARDS AT PRINT SCALE (EACH 3.4 x 5.1 IN ON THE BACK)</text>
    <g transform="translate(60,52)">
      <use xlink:href="#c1" x="0" y="0"/><use xlink:href="#c2" x="180" y="0"/><use xlink:href="#c3" x="360" y="0"/><use xlink:href="#c4" x="540" y="0"/><use xlink:href="#c5" x="720" y="0"/><use xlink:href="#c6" x="900" y="0"/>
    </g>
    <g transform="translate(60,320)" font-size="13" fill="#212121">
      <text y="0">Numbers are not 1 to 6. 02 is the TRAX line that opened for 2002. 11 is Wasatch elevation in thousands of feet. 03 is tacos al pastor, three on a plate.</text>
      <text y="22">26 is the north arm's salinity, 26 percent. 21 is DWR's 21 brine-shrimp cysts per liter left at season's end. 47 is 1847 and Days of '47, the jaripeo weekend.</text>
      <text y="44" fill="#555">Artwork is flat spot color, Don Clemente proportions (2:3 card, numeral top-left, caption on the foot rule). A Salt Lake illustrator redraws all six; these are blocking.</text>
    </g>
  </g>

  <!-- SPEC STRIP -->
  <g transform="translate(60,1300)">
    <rect width="1080" height="170" fill="#F6F1EC" stroke="#212121"/>
    <g font-size="13" fill="#212121">
      <text x="20" y="28" font-weight="700" letter-spacing="2">SPEC</text>
      <text x="20" y="54"><tspan font-weight="700">Blank:</tspan> heavyweight boxy tee, drop shoulder, 1 in rib collar, side-seamed. Unisex, XS to 4XL (lowrider club sizing runs big).</text>
      <text x="20" y="76"><tspan font-weight="700">Fabric:</tspan> 7.5 oz (255 gsm) 100% ringspun cotton, garment-dyed Ink black, soft hand so the 9-color print does not board up.</text>
      <text x="20" y="98"><tspan font-weight="700">Decoration:</tspan> back, 9-color spot screen print on a Cream underbase, board 11 in wide x 11 in tall, top of board 3 in below collar;</text>
      <text x="20" y="118">front, one card (El Camarón) 3.4 x 5.1 in on the left chest; LOTERÍA SALT LAKE wordmark 0.4 in cap height under the board.</text>
      <text x="20" y="140"><tspan font-weight="700">Colorway:</tspan> Ink #212121 body; cards in Cream, Light Sky, Salt Pink, Light Pink, Sego Lily, Sage, Aspen Gold, Meadow, Rodeo Red, Terracotta, Mountain Navy.</text>
      <text x="20" y="160"><tspan font-weight="700">Label:</tspan> interior neck, salt-crystal line icon plus "Diseñado en Salt Lake County" and the community-org partner line.</text>
    </g>
  </g>
</svg>
