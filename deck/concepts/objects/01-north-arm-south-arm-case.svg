<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
<title>North Arm / South Arm goggle and glasses case</title>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#212121">
<text x="60" y="78" font-size="13" letter-spacing="2.5" font-weight="600">VISIT SALT LAKE · MERCH ROUND 1 · LANE 3 OBJECTS · PIECE 01</text>
<text x="60" y="130" font-size="40" font-family="'Ivar Display', Georgia, 'Times New Roman', serif">North Arm / South Arm</text>
<text x="60" y="160" font-size="15" fill="#555">Goggle and glasses case. The Great Salt Lake from orbit, split at the railroad causeway. Lab label, filled in by hand at the counter.</text>
<line x1="60" y1="185" x2="1140" y2="185" stroke="#212121" stroke-width="1"/>
</g>
<text x="60" y="230" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2.5" font-weight="600" fill="#212121">FRONT · 7.5 × 4 × 2 IN</text><g transform="translate(60,250)"><clipPath id="cpf"><rect width="760" height="400" rx="34"/></clipPath><g clip-path="url(#cpf)"><rect width="760" height="400" fill="#147CB2"/><polygon points="0,0 760,0 760,72.0 0,344.0" fill="#F58B88"/><line x1="760" y1="72.0" x2="0" y2="344.0" stroke="#F6F1EC" stroke-width="7"/><line x1="760" y1="72.0" x2="0" y2="344.0" stroke="#212121" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/><pattern id="ripf" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 H12 M0,0 V12" stroke="#fff" stroke-width="0.5" opacity="0.18"/></pattern><rect width="760" height="400" fill="url(#ripf)"/></g><rect width="760" height="400" rx="34" fill="none" stroke="#212121" stroke-width="2"/><rect x="40" y="-9" width="680" height="18" rx="9" fill="#212121"/><line x1="52" y1="0" x2="708" y2="0" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="10" y="10" width="740" height="380" rx="26" fill="none" stroke="#212121" stroke-width="0.7" stroke-dasharray="5 4" opacity="0.6"/></g><g transform="translate(680,241)"><rect x="0" y="-2" width="24" height="22" rx="4" fill="#212121"/><path d="M24,9 l40,0 l0,20 l-28,0 z" fill="#F6F1EC" stroke="#212121" stroke-width="1.5"/><text x="30" y="24" font-family="'Space Mono', 'Courier New', monospace" font-size="8" fill="#212121">4219</text></g><rect x="490" y="435" width="300" height="175" fill="#F6F1EC" stroke="#212121" stroke-width="1"/><rect x="494" y="439" width="292" height="167" fill="none" stroke="#212121" stroke-width="0.5" stroke-dasharray="2 2"/><g font-family="'Space Mono', 'Courier New', monospace" fill="#212121"><text x="506" y="467" font-size="18" font-weight="700">GOGGLE / GLASSES CASE</text><text x="506" y="485" font-size="11">7.5 × 4 × 2 in · foam lined · one of each</text><line x1="506" y1="495" x2="774" y2="495" stroke="#212121" stroke-width="0.8"/><text x="506" y="515" font-size="11">Packed:  in Salt Lake, Utah · 4,219 ft</text><text x="506" y="537" font-size="11">Canyon:</text><line x1="578" y1="539" x2="774" y2="539" stroke="#212121" stroke-width="0.8"/><text x="506" y="559" font-size="11">Date:</text><line x1="578" y1="561" x2="774" y2="561" stroke="#212121" stroke-width="0.8"/><text x="506" y="581" font-size="11">For:</text><line x1="578" y1="583" x2="774" y2="583" stroke="#212121" stroke-width="0.8"/><text x="506" y="600" font-size="7.5">North arm pink, south arm blue, one causeway between. Made for a glovebox.</text></g><polygon points="764.0,447.1 770.6,452.6 772.8,461.4 767.3,466.9 758.5,465.8 755.2,457.0 759.6,450.4" fill="none" stroke="#212121" stroke-width="1.32" stroke-linejoin="round"/><line x1="755.2" y1="457" x2="767.3" y2="466.9" stroke="#212121" stroke-width="0.8800000000000001"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#212121"><line x1="360" y1="456.0" x2="360" y2="690" stroke="#212121" stroke-width="0.7"/><text x="368" y="694">causeway: 1/4 in cream binding tape, bartacked both ends, runs around the gusset</text><text x="80" y="282" font-size="10" fill="#212121">north arm · Salt Pink</text><text x="800" y="636" text-anchor="end" font-size="10" fill="#F6F1EC">south arm · Sky</text></g><text x="60" y="770" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2.5" font-weight="600" fill="#212121">BACK · WEBBING LOOP, HEAT-TRANSFER EYEBROW</text><g transform="translate(60,790)"><clipPath id="cpb"><rect width="760" height="400" rx="34"/></clipPath><g clip-path="url(#cpb)"><rect width="760" height="400" fill="#147CB2"/><polygon points="0,0 760,0 760,344.0 0,72.0" fill="#F58B88"/><line x1="0" y1="72.0" x2="760" y2="344.0" stroke="#F6F1EC" stroke-width="7"/><line x1="0" y1="72.0" x2="760" y2="344.0" stroke="#212121" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/><pattern id="ripb" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 H12 M0,0 V12" stroke="#fff" stroke-width="0.5" opacity="0.18"/></pattern><rect width="760" height="400" fill="url(#ripb)"/></g><rect width="760" height="400" rx="34" fill="none" stroke="#212121" stroke-width="2"/><rect x="40" y="-9" width="680" height="18" rx="9" fill="#212121"/><line x1="52" y1="0" x2="708" y2="0" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="10" y="10" width="740" height="380" rx="26" fill="none" stroke="#212121" stroke-width="0.7" stroke-dasharray="5 4" opacity="0.6"/></g><path d="M100,812 l-46,0 a12,12 0 0 0 0,24 l46,0" fill="none" stroke="#212121" stroke-width="8"/><path d="M100,812 l-46,0 a12,12 0 0 0 0,24 l46,0" fill="none" stroke="#F6F1EC" stroke-width="3" stroke-dasharray="3 3"/><text x="790" y="1156" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2.5" font-weight="500" fill="#F6F1EC">40.7608° N 111.8910° W · ELEV, 4,219 FT</text><g transform="translate(880,790)"><clipPath id="cpe"><rect width="200" height="110" rx="30"/></clipPath><rect width="200" height="110" rx="30" fill="#F58B88"/><rect x="100" width="100" height="110" fill="#147CB2" clip-path="url(#cpe)"/><line x1="100" y1="0" x2="100" y2="110" stroke="#F6F1EC" stroke-width="7"/><rect width="200" height="110" rx="30" fill="none" stroke="#212121" stroke-width="2"/><rect x="30" y="-9" width="140" height="18" rx="9" fill="#212121"/></g><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#212121"><text x="880" y="930">END · 2 in gusset, 8 mm closed-cell foam,</text><text x="880" y="948">split continues around the box.</text><text x="880" y="976">Inside: Light Pink microfiber, flat divider,</text><text x="880" y="994">goggles one side, glasses the other, never</text><text x="880" y="1012">touching. Lens cloth sewn to the divider.</text></g><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#212121"><line x1="60" y1="1300" x2="1140" y2="1300" stroke="#212121" stroke-width="1"/><text x="60" y="1328" font-size="12" letter-spacing="2.5" font-weight="600">SPEC</text><text x="60.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">BLANK</text><text x="60.0" y="1386" font-size="11">Sewn box case, 7.5 × 4 × 2 in</text><text x="60.0" y="1404" font-size="11">Molded 8 mm EVA core, flat divider</text><text x="60.0" y="1422" font-size="11">Waterproof coil zip, Ink tape</text><text x="276.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">FABRIC WEIGHT</text><text x="276.0" y="1386" font-size="11">210D ripstop nylon, PU, 4.2 oz</text><text x="276.0" y="1404" font-size="11">Salt Pink and Sky panels</text><text x="276.0" y="1422" font-size="11">Light Pink microfiber liner</text><text x="492.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">DECORATION</text><text x="492.0" y="1386" font-size="11">Panel colorblock, cut and sewn</text><text x="492.0" y="1404" font-size="11">Woven label 3 × 1.75 in, pen-fill</text><text x="492.0" y="1422" font-size="11">Heat-transfer eyebrow, back, cream</text><text x="708.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">COLORWAY</text><text x="708.0" y="1386" font-size="11">Salt Pink #F58B88 (north arm)</text><text x="708.0" y="1404" font-size="11">Sky #147CB2 (south arm)</text><text x="708.0" y="1422" font-size="11">Cream #F6F1EC tape, Ink zip</text><text x="924.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">PLACEMENT</text><text x="924.0" y="1386" font-size="11">Label: 3 × 1.75 in, lower right front</text><text x="924.0" y="1404" font-size="11">Causeway: 1/4 in tape, corner-corner</text><text x="924.0" y="1422" font-size="11">Eyebrow: 4.5 × 0.2 in, back lower right</text></g></svg>