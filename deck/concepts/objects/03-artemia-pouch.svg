">Solid brass swivel snap hook</text><text x="276.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">FABRIC WEIGHT</text><text x="276.0" y="1386" font-size="13">Full-grain vegetable-tanned leather</text><text x="276.0" y="1404" font-size="13">3.5 oz (1.4 mm), Sego Lily finish</text><text x="276.0" y="1422" font-size="13">Unlined, painted edges</text><text x="492.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">DECORATION</text><text x="492.0" y="1386" font-size="13">Blind deboss, brass die, 0.4 mm</text><text x="492.0" y="1404" font-size="13">One mark only: the brine shrimp</text><text x="492.0" y="1422" font-size="13">Inside stamp 6 pt, blind</text><text x="708.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">COLORWAY</text><text x="708.0" y="1386" font-size="13">Sego Lily #FFDDA3 leather</text><text x="708.0" y="1404" font-size="13">Ink #212121 edges and zip tape</text><text x="708.0" y="1422" font-size="13">Unlacquered brass hardware</text><text x="924.0" y="1362" font-size="11" letter-spacing="1.5" fill="#777">PLACEMENT</text><text x="924.0" y="1386" font-size="13">Shrimp: 2.75 × 1.2 in, centered front</text><text x="924.0" y="1404" font-size="13">Card slot: 3.4 × 2.2 in, back</text><text x="924.0" y="1422" font-size="13">Inside stamp: 1.6 × 0.1 in, under zip</text></g></svg>