<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
<title>Artemia keys and transit card pouch</title>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#212121">
<text x="60" y="78" font-size="13" letter-spacing="2.5" font-weight="600">VISIT SALT LAKE · MERCH ROUND 1 · LANE 3 OBJECTS · PIECE 03</text>
<text x="60" y="130" font-size="40" font-family="'Ivar Display', Georgia, 'Times New Roman', serif">Artemia</text>
<text x="60" y="160" font-size="15" fill="#555">Keys and transit card pouch in full-grain leather. The brine shrimp, Utah's state crustacean, blind debossed, and nothing else.</text>
<line x1="60" y1="185" x2="1140" y2="185" stroke="#212121" stroke-width="1"/>
</g>
