eight="381.0" rx="30" fill="none" stroke="#B07A2A" stroke-width="0.8" stroke-dasharray="6 4"/><rect x="227.5" y="888" width="340" height="214" rx="14" fill="#147CB2" stroke="#212121" stroke-width="1.5"/><text x="397.5" y="922" text-anchor="middle" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#F6F1EC">transit card · tap here</text><path d="M100,950 L695,950 L695,1195.0 a40,40 0 0 1 -40,40 L140,1235.0 a40,40 0 0 1 -40,-40 Z" fill="#FFDDA3" stroke="#212121" stroke-width="1.5"/><path d="M108,958 L687,958" stroke="#B07A2A" stroke-width="0.8" stroke-dasharray="6 4"/><path d="M367.5,948 a30,10 0 0 0 60,0" fill="#FFDDA3" stroke="#212121" stroke-width="1.5"/><text x="705" y="1213.0" text-anchor="end" font-family="'Space Mono', 'Courier New', monospace" font-size="8" fill="#B07A2A">4,219 FT · SALT LAKE, UTAH</text><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#212121"><text x="793" y="840">INSIDE</text><text x="793" y="859">Unlined, flesh side up, edges painted Ink.</text><text x="793" y="878">Brass D-ring on a 2 in leather tab for the</text><text x="793" y="897">key ring, so the keys hang and do not</text><text x="793" y="916">scratch the card.</text><text x="793" y="935"></text><text x="793" y="954">Stamped on the inside only, 6 pt blind:</text><text x="793" y="973">"Full grain. Made in Utah. Carry it daily."</text><text x="793" y="992">(statement, not a tagline: it is the care</text><text x="793" y="1011">instruction.)</text><text x="793" y="1030"></text><text x="793" y="1049">Patina will go from Sego Lily to a deep</text><text x="793" y="1068">honey in a season. That is the point.</text></g><g transform="translate(825,1130)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#212121"><rect width="260" height="120" rx="12" fill="none" stroke="#212121" stroke-width="1"/><g transform="translate(40,60) scale(0.45)" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" s