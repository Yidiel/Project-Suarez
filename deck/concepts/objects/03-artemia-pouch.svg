><circle cx="-18" cy="24" r="5.5" fill="#B07A2A" stroke="none"/><path d="M0,0 c-12,-3 -24,-3 -38,2" stroke-width="1.44"/><circle cx="-5" cy="0" r="1.8" fill="#B07A2A" stroke="none"/><path d="M198,16 c4,18 18,26 32,22 c12,-4 12,-18 2,-22" stroke-width="1.92"/><circle cx="208" cy="26" r="2" fill="#B07A2A" stroke="none"/><circle cx="218" cy="32" r="2" fill="#B07A2A" stroke="none"/><circle cx="226" cy="24" r="2" fill="#B07A2A" stroke="none"/><circle cx="216" cy="22" r="2" fill="#B07A2A" stroke="none"/></g><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#212121"><line x1="745" y1="530" x2="785" y2="530" stroke="#212121" stroke-width="0.7"/><text x="793" y="500">Artemia franciscana, lateral.</text><text x="793" y="518">Eleven pairs of leaf legs, two stalked eyes,</text><text x="793" y="536">brood sac, forked tail. Drawn from the DWR</text><text x="793" y="554">photo, to be redrawn by an illustrator as a</text><text x="793" y="572">single-weight line for the brass die.</text><text x="793" y="610">Deboss 2.75 × 1.2 in, 0.4 mm deep, no foil.</text><text x="793" y="628">The leather darkens where it is pressed,</text><text x="793" y="646">then the whole thing darkens with use.</text><text x="793" y="684">Hardware: solid brass, unlacquered.</text><text x="793" y="702">Swivel snap hook, #5 brass zip, Ink tape.</text></g><text x="60" y="812" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2.5" font-weight="600" fill="#212121">BACK · EXTERIOR CARD SLOT, TAP WITHOUT OPENING</text><rect x="60" y="830" width="675" height="405.0" rx="40" fill="#FFDDA3" stroke="#212121" stroke-width="2"/><rect x="227.5" y="888" width="340" height="214" rx="14" fill="#147CB2" stroke="#212121" stroke-width="1.5"/><text x="397.5" y="922" text-anchor="middle" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#F6F1EC">transit card · tap here</text><path d="M100,950 L695,950 L695,1195.0 a40,40 0 0 1 -40,40 L140,1235.0 a40,40 0 0 1 -40,-40 Z" fill="#FFDDA3" stroke="#212121" stroke-width="1.5"/><path d="M108,958 L687,958" stroke="#B07A2A" stroke-width="0.8" stroke-dasharray="6 4"/><path d="M367.5,948 a30,10 0 0 0 60,0" fill="#FFDDA3" stroke="#212121" stroke-width="1.5"/><text x="705" y="1213.0" text-anchor="end" font-family="'Space Mono', 'Courier New', monospace" font-size="8" fill="#B07A2A">4,219 FT · SALT LAKE, UTAH</text><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#212121"><text x="793" y="840">INSIDE</text><text x="793" y="859">Unlined, flesh side up, edges painted Ink.</text><text x="793" y="878">Brass D-ring on a 2 in leather tab for the</text><text x="793" y="897">key ring, so the keys hang and do not</text><text x="793" y="916">scratch the card.</text><text x="793" y="935"></text><text x="793" y="954">Stamped inside only, 6 pt blind:</text><text x="793" y="973">Full grain. Made in Utah. Carry it daily.</text><text x="793" y="992">(a care instruction, not a tagline)</text><text x="793" y="1011"></text><text x="793" y="1030">Patina goes from Sego Lily to a deep</text><text x="793" y="1049">honey in a season. That is the point.</text></g><g transform="translate(805,1100)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#212121"><rect width="280" height="120" rx="12" fill="none" stroke="#212121" stroke-width="1"/><g transform="translate(50,60) scale(0.45)" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0,0 C30,-24 110,-26 190,-14 C250,-5 300,4 352,10"/><path d="M0,0 C30,20 110,24 190,16 C250,12 300,13 352,14"/><path d="M352,10 L380,-4 M352,14 L382,26"/><path d="M380,-4 l7,-6 M380,-4 l8,1 M382,26 l8,4 M382,26 l7,-4" stroke-width="1.68"/><line x1="211.2" y1="-9.8" x2="211.2" y2="13.8" stroke-width="1.44"/><line x1="233.3" y1="-6.3" x2="233.3" y2="12.9" stroke-width="1.44"/><line x1="254.7" y1="-2.9" x2="254.7" y2="12.3" stroke-width="1.44"/><line x1=