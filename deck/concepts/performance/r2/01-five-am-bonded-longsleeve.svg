4" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-178" cy="-104" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="178" cy="-104" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-150" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="150" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-157" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="157" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-164" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="164" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-171" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="171" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-178" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="178" cy="-96" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-150" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="150" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-157" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="157" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-164" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="164" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-171" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="171" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-178" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="178" cy="-88" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-150" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="150" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-157" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="157" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-164" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="164" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-171" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="171" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="-178" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><circle cx="178" cy="-80" r="1.1" fill="#F6F1EC" fill-opacity="0.55"/><text x="0" y="-205" font-size="58" fill="#B9BDC1" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">NOBODY</text>
<text x="0" y="-147" font-size="58" fill="#B9BDC1" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">IS WATCHING</text>
<text x="0" y="-89" font-size="58" fill="#B9BDC1" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">AT 5 A.M.</text>
<text x="0" y="-31" font-size="58" fill="#B9BDC1" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">THAT IS</text>
<text x="0" y="27" font-size="58" fill="#B9BDC1" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">THE POINT.</text>
</g>
<g transform="translate(960,330) scale(0.46)">
<clipPath id="c1b"><path d="M-70,-330 L-205,-300 L-360,60 L-280,92 L-190,-130 L-195,330 L195,330 L190,-130 L280,92 L360,60 L205,-300 L70,-330 Q0,-316 -70,-330 Z"/></clipPath>
<path d="M-70,-330 L-205,-300 L-360,60 L-280,92 L-190,-130 L-195,330 L195,330 L190,-130 L280,92 L360,60 L205,-300 L70,-330 Q0,-316 -70,-330 Z" fill="#13375D" stroke="#212121" stroke-width="2.391304347826087"/>
<path d="M-205,-300 L-190,-130 M205,-300 L190,-130 M-345,68 L-268,99 M345,68 L268,99 M-195,312 L195,312" fill="none" stroke="#0C2440" stroke-width="1.9565217391304348"/>
<path d="M-78,-336 Q0,-306 78,-336" fill="none" stroke="#0C2440" stroke-width="1.9565217391304348"/>
</g>
<text x="960" y="186" font-size="7" fill="#B9BDC1" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1.6">SALT LAKE</text>
<text x="960" y="520" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >Back. Nothing but the reflective neck hit.</text>
<circle cx="960" cy="800" r="190" fill="#06101C" stroke="#212121" stroke-width="1"/>
<clipPath id="ins1"><circle cx="960" cy="800" r="190"/></clipPath>
<g clip-path="url(#ins1)"><radialGradient id="beam" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2A3F5E"/><stop offset="1" stop-color="#06101C"/></radialGradient><circle cx="960" cy="800" r="190" fill="url(#beam)"/><text x="960" y="752" font-size="62" fill="#FFFFFF" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.6" filter="url(#glow)">IS WATCHING</text>
<text x="960" y="818" font-size="62" fill="#FFFFFF" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.6" filter="url(#glow)">AT 5 A.M.</text>
<text x="960" y="884" font-size="62" fill="#FFFFFF" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.6" filter="url(#glow)">THAT IS</text>
</g>
<text x="960" y="1020" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >The same chest in a headlamp. 3M Scotchlite 8710 film,</text>
<text x="960" y="1040" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >lit at 2 in, no colour, no outline.</text>
<text x="72" y="1120" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Set like a 1990 Wieden+Kennedy insert, centred on the chest at 9 by 11 inches, Futura Extra Bold</text>
<text x="72" y="1143" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Condensed in production. Dawn patrol is the Salt Lake habit nobody photographs: skin track by</text>
<text x="72" y="1166" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >headlamp, Shoreline by five, at the desk by eight. The shirt says it only when a light hits it.</text>
<text x="72" y="1230" font-size="14" fill="#666" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Bonded hems and cuffs, flatlock seams, laser-perforated underarm gussets. The salt-crystal icon sits on the</text>
<text x="72" y="1251" font-size="14" fill="#666" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >woven size tab at the hem.</text>
<rect x="72" y="1330" width="110" height="64" fill="#13375D" stroke="#212121" stroke-width="0.8"/>
<text x="72" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Mountain Navy</text>
<rect x="222" y="1330" width="110" height="64" fill="#B9BDC1" stroke="#999" stroke-width="0.8"/>
<text x="222" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Reflective grey, by day</text>
<rect x="372" y="1330" width="110" height="64" fill="#FFFFFF" stroke="#999" stroke-width="0.8"/>
<text x="372" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Reflective white, lit</text>
<rect x="522" y="1330" width="110" height="64" fill="#212121" stroke="#212121" stroke-width="0.8"/>
<text x="522" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Second run: Ink</text>
<rect x="672" y="1330" width="110" height="64" fill="#0D4C26" stroke="#212121" stroke-width="0.8"/>
<text x="672" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Second run: Forest</text>
</svg>
