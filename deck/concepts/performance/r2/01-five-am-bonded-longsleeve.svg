<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif">
<title>Five A.M. bonded long sleeve</title>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<text x="72" y="96" font-size="44" fill="#212121" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-weight="400" text-anchor="start" >Five A.M.</text>
<text x="72" y="132" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >A bonded long sleeve in 118 gsm micro-eyelet recycled polyester. The copy is the whole garment,</text>
<text x="72" y="154" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >printed in reflective film that reads grey by day and white in a headlamp.</text>
<g transform="translate(440,640) scale(1.3)">
<clipPath id="c1f"><path d="M-70,-330 L-205,-300 L-360,60 L-280,92 L-190,-130 L-195,330 L195,330 L190,-130 L280,92 L360,60 L205,-300 L70,-330 Q0,-292 -70,-330 Z"/></clipPath>
<path d="M-70,-330 L-205,-300 L-360,60 L-280,92 L-190,-130 L-195,330 L195,330 L190,-130 L280,92 L360,60 L205,-300 L70,-330 Q0,-292 -70,-330 Z" fill="#13375D" stroke="#212121" stroke-width="0.8461538461538461"/>
<path d="M-205,-300 L-190,-130 M205,-300 L190,-130 M-345,68 L-268,99 M345,68 L268,99 M-195,312 L195,312" fill="none" stroke="#0C2440" stroke-width="0.6923076923076923"/>
<path d="M-70,-330 Q0,-292 70,-330 M-78,-336 Q0,-282 78,-336" fill="none" stroke="#0C2440" stroke-width="0.6923076923076923"/>
</g>
