<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif">
<title>Gain Alpha Direct pullover</title>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<defs>
<pattern id="alpha" width="13" height="13" patternUnits="userSpaceOnUse">
  <rect width="13" height="13" fill="#7E221F"/>
  <rect x="1" y="1" width="11" height="11" rx="3.5" fill="#A42F2C"/>
  <path d="M3,4 q3,-2.5 6,0 M3,8.5 q3,-2.5 6,0" stroke="#C04C47" stroke-width="1" fill="none" stroke-linecap="round"/>
</pattern>
<pattern id="alphaMacro" width="56" height="56" patternUnits="userSpaceOnUse">
  <rect width="56" height="56" fill="#6E1B18"/>
  <rect x="4" y="4" width="48" height="48" rx="15" fill="#A42F2C"/>
  <path d="M10,15 q8,-8 16,0 q8,8 16,0 M8,32 q8,-8 16,0 q8,8 16,0 M14,45 q8,-6 14,0" stroke="#C8524D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</pattern>
</defs>
<text x="72" y="96" font-size="44" fill="#212121" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-weight="400" text-anchor="start" >Gain</text>
<text x="72" y="132" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >A raglan quarter-zip in Polartec Alpha Direct 90. The loft is the garment. The only thing on it is a</text>
<text x="72" y="154" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >bonded strip that runs from the hem to the collar, and the number of feet it stands for.</text>
<g transform="translate(548,620) scale(1.1)">
<clipPath id="c2f"><path d="M-200,-380 L-200,-406 Q-138,-420 -70,-406 L-70,-380 L83,-332 L168,-50 L94,-28 L68,-150 L68,210 L-332,210 L-332,-150 L-358,-28 L-432,-50 L-347,-332 Z"/></clipPath>
<path d="M-200,-380 L-200,-406 Q-138,-420 -70,-406 L-70,-380 L83,-332 L168,-50 L94,-28 L68,-150 L68,210 L-332,210 L-332,-150 L-358,-28 L-432,-50 L-347,-332 Z" fill="url(#alpha)" stroke="#212121" stroke-width="1.0909090909090908"/>
<path d="M-200,-376 L-332,-150 M-70,-376 L68,-150" stroke="#4A100E" stroke-width="1.2" fill="none" stroke-dasharray="4 2"/>
<rect x="-332" y="194" width="400" height="16" fill="#5E1714"/>
<path d="M168,-50 L94,-28 L90,-42 L164,-64 Z M-432,-50 L-358,-28 L-362,-42 L-436,-64 Z" fill="#5E1714"/>
<path d="M-200,-380 L-200,-406 Q-138,-420 -70,-406 L-70,-380" fill="none" stroke="#4A100E" stroke-width="1.2"/>
<rect x="-140" y="-412" width="10" height="150" fill="#5E1714"/><path d="M-135,-408 L-135,-268" stroke="#F6F1EC" stroke-width="1" stroke-dasharray="2 2"/><rect x="-139" y="-274" width="8" height="14" rx="2" fill="#212121"/>
<rect x="-112" y="-378" width="48" height="574" fill="#F6F1EC" stroke="#D9D0C6" stroke-width="0.6"/>
<rect x="-109.5" y="-375.5" width="43" height="569" fill="none" stroke="#C9BFB4" stroke-width="0.5"/>
<text transform="translate(-75.0,170) rotate(-90)" font-size="42" fill="#212121" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" letter-spacing="1">4,807</text>
</g>
<g transform="translate(985,345) scale(0.5)"><clipPath id="c2b"><path d="M-200,-380 L-200,-406 Q-138,-420 -70,-406 L-70,-380 L83,-332 L168,-50 L94,-28 L68,-150 L68,210 L-332,210 L-332,-150 L-358,-28 L-432,-50 L-347,-332 Z"/></clipPath><path d="M-200,-380 L-200,-406 Q-138,-420 -70,-406 L-70,-380 L83,-332 L168,-50 L94,-28 L68,-150 L68,210 L-332,210 L-332,-150 L-358,-28 L-432,-50 L-347,-332 Z" fill="url(#alpha)" stroke="#212121" stroke-width="2.4"/><path d="M-200,-376 L-332,-150 M-70,-376 L68,-150" stroke="#4A100E" stroke-width="1.4" fill="none" stroke-dasharray="4 2"/><rect x="-332" y="194" width="400" height="16" fill="#5E1714"/><text x="-135" y="-350" font-size="10" fill="#B9BDC1" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="2.4">SALT LAKE</text></g>
<text x="985" y="480" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >Back. Loft only, reflective at the neck.</text>
<clipPath id="ins2"><circle cx="985" cy="790" r="190"/></clipPath>
<g clip-path="url(#ins2)"><rect x="795" y="600" width="380" height="380" fill="url(#alphaMacro)"/><rect x="920" y="600" width="130" height="380" fill="#F6F1EC"/><rect x="927" y="600" width="116" height="380" fill="none" stroke="#C9BFB4" stroke-width="1.2"/><text transform="translate(1020,960) rotate(-90)" font-size="112" fill="#212121" font-family="Oswald, 'Futura Extra Bold Condensed', 'Arial Narrow', Impact, sans-serif" font-weight="700" letter-spacing="2">4,807</text></g>
<circle cx="985" cy="790" r="190" fill="none" stroke="#212121" stroke-width="1"/>
<text x="985" y="1020" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >The strip at 3:1. Pertex Quantum Air bonded over the loft,</text>
<text x="985" y="1040" font-size="13" fill="#555" font-family="" font-weight="400" text-anchor="middle" >one-colour heat transfer, numerals 1.6 in tall.</text>
<text x="72" y="1120" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Downtown sits at 4,219 feet. Mount Olympus, the peak in every office window, tops out at 9,026.</text>
<text x="72" y="1143" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >The strip is the 4,807 feet between them, drawn as a single climb up the body of the garment,</text>
<text x="72" y="1166" font-size="15" fill="#3A3A3A" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >read the way you read it on the way up. No other mark anywhere.</text>
<text x="72" y="1230" font-size="14" fill="#666" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Alpha Direct takes no ink and no needle, so the strip is also the only place a print can live, and it doubles as</text>
<text x="72" y="1251" font-size="14" fill="#666" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >the one wind-blocking panel on the chest. Lycra-bound hem and cuffs, YKK Vislon quarter zip.</text>
<rect x="72" y="1330" width="110" height="64" fill="#A42F2C" stroke="#212121" stroke-width="0.8"/>
<text x="72" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Rodeo Red loft</text>
<rect x="222" y="1330" width="110" height="64" fill="#F6F1EC" stroke="#999" stroke-width="0.8"/>
<text x="222" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Cream strip</text>
<rect x="372" y="1330" width="110" height="64" fill="#212121" stroke="#212121" stroke-width="0.8"/>
<text x="372" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Ink numerals</text>
<rect x="522" y="1330" width="110" height="64" fill="#13375D" stroke="#212121" stroke-width="0.8"/>
<text x="522" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Second run: Navy loft</text>
<rect x="672" y="1330" width="110" height="64" fill="#FFDDA3" stroke="#999" stroke-width="0.8"/>
<text x="672" y="1416" font-size="13" fill="#333" font-family="Inter, Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="400" text-anchor="start" >Second run: Sego strip</text>
</svg>
