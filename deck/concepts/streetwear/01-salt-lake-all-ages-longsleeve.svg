<text x="60" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" >Marker-on-pink flyer logic (29-flickr-flyer-a). Lettering set in Permanent Marker as a stand-in; a letterer redraws every word by hand in Sharpie, then it is xeroxed once before separation.</text>
<text x="60" y="190" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" >One ink. The shirt is the pink paper.</text>

<g id="spec">
<rect x="60" y="1330" width="1080" height="130" fill="none" stroke="#212121" stroke-width="1.5"/>
<text x="78" y="1356" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="start" letter-spacing="3">SPEC</text>

<text x="78" y="1382" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >BLANK: heavyweight longsleeve, 6.5 oz 100% ringspun cotton, garment pigment-dyed Salt Pink #F58B88 (uneven dye wanted; cuffs and collar ribbed, no side seams).</text>
<text x="78" y="1404" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >DECORATION: 1-color screen print, Ink #212121 plastisol with a soft-hand additive. Hand-lettered art, xeroxed one generation, no halftones.</text>
<text x="78" y="1426" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >PLACEMENTS: full back 12.5 x 17 in; left chest 4 x 2.5 in; wearer-left sleeve 2.5 x 14 in, shoulder to 2 in above cuff; wearer-right cuff XXX stack 1.5 x 5 in.</text>
<text x="78" y="1448" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >COLORWAY: Salt Pink body / Ink print. Alt: Cream #F6F1EC body / Rodeo Red #A42F2C print (30-flickr-flyer-b).</text>
</g>
