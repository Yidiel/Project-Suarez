<text x="260" y="70" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="24" font-weight="normal" fill="#F6F1EC" text-anchor="middle" letter-spacing="4">ALL AGES</text>
<rect x="150" y="80" width="220" height="2" fill="#F6F1EC"/></g>
<text x="640" y="1300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" letter-spacing="2">BACK  /  UPPER BACK 4.5 x 1.5 IN  /  HOOD LINING BLUE</text>
<text x="60" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" >Phrase-first, Pleasures logic (08-pleasures-freak-tee-glitter) in the SLC Punk! poster palette (36-slc-punk-poster): white condensed type on black bars over a flat blue field.</text>
<text x="60" y="190" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" >The blue field is left empty on purpose. That is the nothing. Hood lining is the same blue so the color shows when the hood is down.</text>

<g id="spec">
<rect x="60" y="1330" width="1080" height="130" fill="none" stroke="#212121" stroke-width="1.5"/>
<text x="78" y="1356" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="start" letter-spacing="3">SPEC</text>

<text x="78" y="1382" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >BLANK: 14 oz cross-grain heavyweight hooded sweatshirt, 100% cotton fleece, Ink #212121 body, hood lined in Poster Blue #1A3BD4 (one off-palette hit), flat cream drawcords, metal aglets.</text>
<text x="78" y="1404" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >DECORATION: 2-color screen print, Cream #F6F1EC + Poster Blue #1A3BD4 plastisol, blue laid down as a flat flood with a slight dry-brush edge; back is 1 color cream.</text>
<text x="78" y="1426" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >PLACEMENTS: front chest panel 11.5 x 13 in, 2.5 in below hood seam, above the pocket; upper back 4.5 x 1.5 in, 1.5 in below collar seam.</text>
<text x="78" y="1448" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#212121" text-anchor="start" >COLORWAY: Ink / Cream / Poster Blue. Alt: Mountain Navy #13375D body with Cream and Salt Pink #F58B88 field (on-palette version).</text>
</g>
</svg>
