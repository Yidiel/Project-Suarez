<rect x="0" y="90" width="290" height="2" fill="#F6F1EC"/><rect x="0" y="97" width="290" height="2" fill="#F6F1EC"/><rect x="0" y="106" width="290" height="190" fill="#1A3BD4"/><text x="8" y="286" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="30" font-weight="normal" fill="#F6F1EC" text-anchor="start" letter-spacing="1">IN SALT LAKE</text>
<rect x="0" y="302" width="290" height="2" fill="#F6F1EC"/><rect x="0" y="309" width="290" height="2" fill="#F6F1EC"/><rect x="0" y="320" width="290" height="2" fill="#F6F1EC"/></g></g>
<text x="110" y="1300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#212121" text-anchor="start" letter-spacing="2">FRONT  /  CHEST PANEL 11.5 x 13 IN, 2 COLORS</text>
<g transform="translate(640,400)"><path d="M170 10 Q160 -150 260 -160 Q360 -150 350 10 Z" fill="#212121" stroke="#555" stroke-width="2.5"/>
<path d="M260 -150 L260 8" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
<path d="M185 0 Q260 30 335 0 L470 45 L575 510 L478 532 L400 205 L400 640 L120 640 L120 205 L42 532 L-55 510 L50 45 Z" fill="#212121" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
