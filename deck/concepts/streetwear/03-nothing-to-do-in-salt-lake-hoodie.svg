<title>03  NOTHING TO DO IN SALT LAKE  (SLC Punk! palette hoodie)</title>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<g id="header">
<text x="60" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#212121" text-anchor="start" letter-spacing="2">VISIT SALT LAKE  /  CONCEPT ROUND 1  /  STREETWEAR LANE</text>

<text x="60" y="100" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="34" font-weight="normal" fill="#212121" text-anchor="start" >03  NOTHING TO DO IN SALT LAKE  (SLC Punk! palette hoodie)</text>

<text x="60" y="128" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#212121" text-anchor="start" >Heavyweight hoodie, one line of text, the SLC Punk! poster palette. What every kid who ever started a band here said first.</text>

<line x1="60" y1="146" x2="1140" y2="146" stroke="#212121" stroke-width="1.5"/>
</g>
