<circle cx="830" cy="1255" r="17" fill="#F6F1EC" stroke="#212121" stroke-width="1.2"/><text x="858.0" y="1262.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#212121" text-anchor="start" >Cream body</text>
<text x="60.0" y="1330.0" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#212121" text-anchor="start" >Three phrases, one layout, three bodies, and the hood lined in the blue on all three.</text>
<text x="60.0" y="1360.0" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#212121" text-anchor="start" >The bar is the title bar from the SLC Punk! poster and the flood is its blue; the flood stays empty</text>
<text x="60.0" y="1390.0" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#212121" text-anchor="start" >because the nothing is the point. Each phrase is something a Salt Lake punk actually says.</text>
<text x="60.0" y="1450.0" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#212121" text-anchor="start" font-style="italic">Cream and Poster Blue plastisol; the blue is pulled with a dry-brush edge so it never reads as a corporate color block.</text>
