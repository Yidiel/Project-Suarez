<symbol id="p2" viewBox="0 0 272 308" overflow="visible"><path d="M0 3 H272 M0 305 H272" stroke="#F6F1EC" stroke-width="1.6" opacity="0"/><rect x="0" y="0" width="272" height="64" fill="#212121"/><path d="M0 70 H272 M0 76 H272" stroke="#F6F1EC" stroke-width="1.8"/><text x="136.0" y="52" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="56" fill="#F6F1EC" text-anchor="middle" letter-spacing="1">SALT LAKE IS</text><g filter="url(#drybrush)"><rect x="0" y="86" width="272" height="222" fill="#1A3BD4"/></g><text x="136.0" y="294" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="32" fill="#F6F1EC" text-anchor="middle" letter-spacing="1">FOR THE WEIRD</text></symbol>
<symbol id="p3" viewBox="0 0 272 308" overflow="visible"><path d="M0 3 H272 M0 305 H272" stroke="#F6F1EC" stroke-width="1.6" opacity="0"/><rect x="0" y="0" width="272" height="64" fill="#212121"/><path d="M0 70 H272 M0 76 H272" stroke="#212121" stroke-width="1.8"/><text x="136.0" y="52" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="56" fill="#F6F1EC" text-anchor="middle" letter-spacing="1">POSERS</text><g filter="url(#drybrush)"><rect x="0" y="86" width="272" height="222" fill="#1A3BD4"/></g><text x="136.0" y="294" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="32" fill="#F6F1EC" text-anchor="middle" letter-spacing="1">GO TO PARK CITY</text></symbol>
</defs>
<rect width="1200" height="1500" fill="#F6F1EC"/>
<text x="60.0" y="118.0" font-family="Anton,Impact,'Arial Narrow',sans-serif" font-size="66" fill="#212121" text-anchor="start" >NOTHING TO DO IN SALT LAKE</text>
<text x="60.0" y="160.0" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#212121" text-anchor="start" >A 14 oz hoodie with one sentence on it, in the palette of the only movie ever made about this scene.</text>
<text x="60.0" y="190.0" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#212121" text-anchor="start" >The drop runs three phrases in three colorways, shown together.</text>
