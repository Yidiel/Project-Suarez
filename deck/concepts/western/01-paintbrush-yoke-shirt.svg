<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <title>Paintbrush Yoke Shirt - Neo-Western lane, Visit Salt Lake</title>
  <defs>
    <!-- chain-stitch dash: short dashes read as a looped chain at this scale -->
    <style>
      .seam{fill:none;stroke:#0b2440;stroke-width:1.2}
      .edge{fill:#13375D;stroke:#0b2440;stroke-width:2}
      .chain{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3.2 2.2}
      .snap{fill:#F6F1EC;stroke:#b7a98f;stroke-width:1}
      .spec{font-size:15px;fill:#212121}
      .spech{font-size:12px;letter-spacing:1.6px;fill:#13375D;font-weight:600}
    </style>
    <!-- one paintbrush stalk: Rodeo Red bracts over Terracotta, Sage stem -->
    <g id="paintbrush">
      <path class="chain" stroke="#8DCEA8" stroke-width="2.4" d="M0 0 C -2 -22 1 -44 0 -66"/>
      <path class="chain" stroke="#8DCEA8" stroke-width="2" d="M0 -28 c -8 -3 -14 -10 -16 -18 M0 -18 c 7 -2 13 -8 15 -15"/>
      <path class="chain" stroke="#D24B27" stroke-width="2.6" d="M0 -66 l -9 -18 l 5 10 l -3 -26 l 6 16 l 1 -30 l 4 30 l 6 -16 l -3 26 l 5 -10 l -9 18"/>
      <path class="chain" stroke="#A42F2C" stroke-width="2.6" d="M-4 -76 l -7 -22 M4 -76 l 7 -22 M-1 -80 l -2 -34 M1 -80 l 2 -34"/>
    </g>
    <!-- one lupine spike: Sky to Light Sky florets stacked on a Sage stem -->
    <g id="lupine">
      <path class="chain" stroke="#8DCEA8" stroke-width="2.4" d="M0 0 C 2 -30 -1 -60 0 -96"/>
      <g class="chain" stroke="#147CB2" stroke-width="2.4">
        <ellipse cx="-7" cy="-40" rx="6" ry="4"/><ellipse cx="7" cy="-46" rx="6" ry="4"/>
        <ellipse cx="-7" cy="-54" rx="6" ry="4"/><ellipse cx="7" cy="-60" rx="6" ry="4"/>
      </g>
      <g class="chain" stroke="#4CACD1" stroke-width="2.4">
        <ellipse cx="-5" cy="-68" rx="5" ry="3.5"/><ellipse cx="5" cy="-74" rx="5" ry="3.5"/>
        <ellipse cx="-4" cy="-82" rx="4" ry="3"/><ellipse cx="3" cy="-88" rx="3.5" ry="2.5"/>
      </g>
      <path class="chain" stroke="#8DCEA8" stroke-width="2" d="M0 -14 c -10 -2 -16 -8 -20 -16 M0 -14 c 10 -2 16 -8 20 -16 M0 -12 c -4 -8 -5 -14 -4 -20 M0 -12 c 4 -8 5 -14 4 -20"/>
    </g>
    <!-- the full back-yoke botanical, drawn at 1 px = 1/32 in; about 4.5 in wide, 3.5 in tall -->
    <g id="botanical">
      <use xlink:href="#paintbrush" transform="translate(-34 0) rotate(-10)"/>
      <use xlink:href="#paintbrush" transform="translate(30 4) rotate(9) scale(0.9)"/>
      <use xlink:href="#lupine" transform="translate(0 2)"/>
      <use xlink:href="#lupine" transform="translate(-66 6) rotate(-16) scale(0.8)"/>
      <use xlink:href="#paintbrush" transform="translate(64 8) rotate(18) scale(0.78)"/>
      <!-- base grass tuft in Sage -->
      <path class="chain" stroke="#8DCEA8" stroke-width="2" d="M-70 8 q 8 -14 18 -6 M-30 10 q 6 -12 14 -6 M14 10 q 6 -12 14 -6 M48 10 q 6 -12 14 -6"/>
    </g>
  </defs>

  <rect width="1200" height="1500" fill="#F6F1EC"/>

  <!-- header -->
  <text x="60" y="64" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="30" fill="#212121">Paintbrush Yoke Shirt</text>
  <text x="60" y="90" class="spech">NEO-WESTERN  ·  01  ·  SNAP SHIRT, MOUNTAIN NAVY BRUSHED TWILL</text>
  <text x="1140" y="64" text-anchor="end" font-size="14" fill="#555">Salt Lake  ·  Albion Basin, 9,500 ft</text>

  <!-- ================= FRONT ================= -->
  <g transform="translate(70 150)">
    <text x="0" y="0" class="spech">FRONT</text>
    <g transform="translate(0 20)">
      <!-- body -->
      <path class="edge" d="M80 130 L190 86 L230 70 L250 92 L270 92 L290 70 L330 86 L440 130 L480 260 L410 282 L400 240 L400 560 L120 560 L120 240 L110 282 L40 260 Z"/>
      <!-- sleeves -->
      <path class="edge" d="M80 130 L40 260 L-10 470 L60 490 L120 240 Z"/>
      <path class="edge" d="M440 130 L480 260 L530 470 L460 490 L400 240 Z"/>
      <!-- cuffs -->
      <path class="edge" d="M-10 470 L60 490 L50 540 L-22 520 Z"/>
      <path class="edge" d="M530 470 L460 490 L470 540 L542 520 Z"/>
      <!-- collar -->
      <path class="edge" d="M190 86 L230 70 L260 150 L250 92 Z"/>
      <path class="edge" d="M330 86 L290 70 L260 150 L270 92 Z"/>
      <!-- front yoke, western pointed -->
      <path class="seam" d="M120 180 L200 180 L215 200 L230 180 L260 150 L290 180 L305 200 L320 180 L400 180"/>
      <!-- placket -->
      <line x1="248" y1="150" x2="248" y2="560" class="seam"/>
      <line x1="272" y1="150" x2="272" y2="560" class="seam"/>
      <!-- sawtooth pockets with flaps -->
      <path class="seam" d="M140 215 L225 215 L225 300 L140 300 Z"/>
      <path class="seam" d="M140 215 L225 215 L225 235 L182 250 L140 235 Z"/>
      <path class="seam" d="M295 215 L380 215 L380 300 L295 300 Z"/>
      <path class="seam" d="M295 215 L380 215 L380 235 L338 250 L295 235 Z"/>
      <!-- pearl snaps -->
      <g>
        <circle class="snap" cx="260" cy="175" r="5"/><circle class="snap" cx="260" cy="245" r="5"/><circle class="snap" cx="260" cy="315" r="5"/>
        <circle class="snap" cx="260" cy="385" r="5"/><circle class="snap" cx="260" cy="455" r="5"/><circle class="snap" cx="260" cy="525" r="5"/>
        <circle class="snap" cx="182" cy="243" r="4"/><circle class="snap" cx="338" cy="243" r="4"/>
        <circle class="snap" cx="4" cy="500" r="4"/><circle class="snap" cx="22" cy="505" r="4"/><circle class="snap" cx="40" cy="510" r="4"/>
        <circle class="snap" cx="516" cy="500" r="4"/><circle class="snap" cx="498" cy="505" r="4"/><circle class="snap" cx="480" cy="510" r="4"/>
      </g>
      <!-- hem seam -->
      <line x1="120" y1="548" x2="400" y2="548" class="seam"/>
      <text x="260" y="600" text-anchor="middle" font-size="13" fill="#555">Front is clean. No chest graphic, no label on the outside.</text>
    </g>
  </g>

  <!-- ================= BACK ================= -->
  <g transform="translate(620 150)">
    <text x="0" y="0" class="spech">BACK</text>
    <g transform="translate(0 20)">
      <path class="edge" d="M80 130 L190 86 L260 76 L330 86 L440 130 L480 260 L410 282 L400 240 L400 560 L120 560 L120 240 L110 282 L40 260 Z"/>
      <path class="edge" d="M80 130 L40 260 L-10 470 L60 490 L120 240 Z"/>
      <path class="edge" d="M440 130 L480 260 L530 470 L460 490 L400 240 Z"/>
      <path class="edge" d="M-10 470 L60 490 L50 540 L-22 520 Z"/>
      <path class="edge" d="M530 470 L460 490 L470 540 L542 520 Z"/>
      <!-- collar stand from behind -->
      <path class="edge" d="M190 86 L260 76 L330 86 L320 112 L260 104 L200 112 Z"/>
      <!-- back western yoke: pointed, deep -->
      <path class="seam" d="M120 190 L200 190 L230 220 L260 190 L290 220 L320 190 L400 190"/>
      <!-- back yoke chain stitch botanical, centered, 4.5 in wide: 1 in = 32 px -->
      <g transform="translate(260 232)">
        <use xlink:href="#botanical"/>
      </g>
      <!-- placement dims -->
      <g stroke="#A42F2C" stroke-width="1" fill="none">
        <line x1="188" y1="64" x2="332" y2="64" stroke-dasharray="4 3"/>
        <line x1="188" y1="58" x2="188" y2="70"/><line x1="332" y1="58" x2="332" y2="70"/>
      </g>
      <text x="260" y="52" text-anchor="middle" font-size="12" fill="#A42F2C">4.5 in wide, 3.5 in tall, centered, 1.25 in below collar seam</text>
      <line x1="120" y1="548" x2="400" y2="548" class="seam"/>
    </g>
  </g>

  <!-- ================= DETAILS ================= -->
  <!-- yoke motif at 2x -->
  <g transform="translate(70 850)">
    <text x="0" y="0" class="spech">BACK YOKE MOTIF, 2X</text>
    <rect x="0" y="14" width="440" height="250" fill="#13375D" stroke="#0b2440" stroke-width="2"/>
    <g transform="translate(220 240) scale(2)">
      <use xlink:href="#botanical"/>
    </g>
    <text x="0" y="290" font-size="13" fill="#555">Indian paintbrush (Rodeo Red over Terracotta) and lupine (Sky, Light Sky), stems Sage.</text>
    <text x="0" y="308" font-size="13" fill="#555">Five thread colors, chain stitch on a Singer 114w103. No fill, no words.</text>
  </g>

  <!-- hidden cuff stitch -->
  <g transform="translate(620 850)">
    <text x="0" y="0" class="spech">INSIDE LEFT CUFF, HIDDEN CHAIN STITCH</text>
    <!-- cuff turned back: outer navy, inner facing shows -->
    <path class="edge" d="M0 60 L440 60 L440 170 L0 170 Z"/>
    <path d="M0 170 L440 170 L440 250 L0 250 Z" fill="#1a4573" stroke="#0b2440" stroke-width="2"/>
    <line x1="0" y1="80" x2="440" y2="80" class="seam"/>
    <circle class="snap" cx="60" cy="115" r="7"/><circle class="snap" cx="110" cy="115" r="7"/><circle class="snap" cx="160" cy="115" r="7"/>
    <text x="220" y="222" text-anchor="middle" font-family="'Dancing Script', 'Brush Script MT', 'Playfair Display', cursive" font-size="34" fill="#FFDDA3" stroke="#FFDDA3" stroke-width="0.6" stroke-dasharray="2 1.6" letter-spacing="1">Albion Basin, 9,500 ft</text>
    <text x="0" y="290" font-size="13" fill="#555">Sego Lily thread, 0.6 in cap height, on the cuff facing. Seen only when the sleeve is rolled.</text>
    <text x="0" y="308" font-size="13" fill="#555">Letterer redraws this as a one-line chain-stitch script; the font here is a stand-in.</text>
  </g>

  <!-- colorway 2 chip -->
  <g transform="translate(70 1200)">
    <text x="0" y="0" class="spech">COLORWAYS</text>
    <rect x="0" y="14" width="90" height="60" fill="#13375D"/><text x="0" y="92" font-size="12" fill="#212121">Mountain Navy twill</text>
    <rect x="200" y="14" width="90" height="60" fill="#A42F2C"/><text x="200" y="92" font-size="12" fill="#212121">Rodeo Red twill (paintbrush shifts to Sego Lily + Aspen Gold)</text>
  </g>

  <!-- ================= SPEC STRIP ================= -->
  <g transform="translate(0 1330)">
    <line x1="60" y1="0" x2="1140" y2="0" stroke="#13375D" stroke-width="1.5"/>
    <text x="60" y="28" class="spech">BLANK</text><text x="60" y="50" class="spec">Western snap shirt, sawtooth flaps, 3-snap cuff, custom cut</text>
    <text x="60" y="80" class="spech">FABRIC</text><text x="60" y="102" class="spec">7 oz brushed cotton twill, garment washed; alt 5.5 oz chambray</text>
    <text x="640" y="28" class="spech">DECORATION</text><text x="640" y="50" class="spec">Chain stitch, 5 colors, back yoke 4.5 x 3.5 in; cuff facing script 5 x 0.6 in</text>
    <text x="640" y="80" class="spech">COLORWAY</text><text x="640" y="102" class="spec">Mountain Navy #13375D (alt Rodeo Red #A42F2C); pearl snaps, copper rims</text>
    <text x="60" y="140" font-size="12" fill="#777">Placement: motif centered on back yoke, top of tallest stalk 1.25 in below collar seam. Hidden stitch inside left cuff only. No outside label; woven label at neck with the salt-crystal line icon.</text>
  </g>
</svg>
